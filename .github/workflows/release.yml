name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install native module build tools
        run: sudo apt-get update && sudo apt-get install -y python3 make g++
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm lint

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install native module build tools
        run: sudo apt-get update && sudo apt-get install -y python3 make g++
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Pack release tarball
        run: pnpm pack:release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"

          shopt -s nullglob
          assets=(release/codex-omni-*.tgz)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release tarball found in release/"
            exit 1
          fi
          cp "${assets[0]}" release/codex-omni.tgz
          gh release upload "${GITHUB_REF_NAME}" \
            "${assets[@]}" \
            release/codex-omni.tgz \
            --clobber
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          shopt -s nullglob
          assets=(release/codex-omni-*.tgz)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release tarball found in release/"
            exit 1
          fi
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "NPM_TOKEN 未配置，跳过 npm publish。可用 GitHub Release 的 tgz 安装。"
            exit 0
          fi
          npm publish "${assets[0]}" --access public

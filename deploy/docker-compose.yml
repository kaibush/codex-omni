services:
  server:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      CODEX_OMNI_HOST: 0.0.0.0
      CODEX_OMNI_PORT: 8790
      CODEX_OMNI_ORIGIN: https://example.com
      CODEX_OMNI_DATABASE: /app/data/codex-omni.db
      CODEX_OMNI_VERSION: ${CODEX_OMNI_VERSION:-}
      CODEX_OMNI_GITHUB_REPO: ${CODEX_OMNI_GITHUB_REPO:-kaibush/codex-omni}
      COOKIE_SECURE: "true"
    volumes:
      - codex-omni-data:/app/data
    expose:
      - "8790"
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    depends_on:
      - server
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ../apps/web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  codex-omni-data:
